<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        font:
          13px system-ui,
          sans-serif;
        padding: 12px;
        background: #0a0a14;
        color: #eee;
      }
      h3 {
        margin: 0 0 8px;
        font-size: 13px;
        color: #00f3ff;
      }
      #tabName {
        font-size: 12px;
        color: #ccc;
        margin-bottom: 10px;
        word-break: break-word;
      }
      #status {
        margin-top: 8px;
        font-size: 11px;
        color: #9aa;
      }
      #footer {
        margin-top: 10px;
        display: flex;
        gap: 6px;
      }
      #footer button {
        flex: 1;
        padding: 7px;
        border-radius: 6px;
        border: 1px solid #ffffff22;
        background: #ffffff12;
        color: #fff;
        cursor: pointer;
        font-size: 12px;
      }
      #footer button:hover {
        background: #ffffff22;
      }
      #footer button:disabled {
        opacity: 0.4;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h3>Capture THIS tab's audio</h3>
    <div id="tabName">Loading…</div>
    <div id="status">Switch to your music tab first, then open this popup.</div>
    <div id="footer">
      <button id="start">Start</button>
      <button id="stop">Stop</button>
    </div>
    <div style="margin-top: 6px; font-size: 10px; color: #667">
      Stuck error? Reload the music tab, then Start again.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
